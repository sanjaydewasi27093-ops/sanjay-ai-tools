<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanjay AI Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#101426;color:white}
header{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#5335d9,#087de0)}
h1{font-size:30px;margin:0 0 10px}
header p{margin:0}
main{max-width:850px;margin:auto;padding:20px}
input{width:100%;padding:15px;border:0;border-radius:12px;font-size:16px}
h2{text-align:center;margin-top:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{background:#202b45;padding:22px 12px;border-radius:15px;text-align:center}
.card span{font-size:30px}
.card h3{margin:12px 0 5px}
.card p{color:#c5cce0;font-size:13px}
footer{text-align:center;padding:25px;color:#aeb8d0}
</style>
</head>
<body>
<header>
<h1>🚀 Sanjay AI Tools</h1>
<p>आपका अपना AI Tools प्लेटफॉर्म</p>
</header>
<main>
<input id="search" placeholder="🔍 AI Tool खोजें..." oninput="filterTools()">
<h2>हमारे AI Tools</h2>
<div class="grid" id="tools">
<div class="card"><span>💬</span><h3>AI Chat</h3><p>AI बातचीत टूल</p></div>
<div class="card"><span>✍️</span><h3>AI Writing</h3><p>लिखने में मदद</p></div>
<div class="card"><span>🎨</span><h3>AI Photo</h3><p>फोटो टूल</p></div>
<div class="card"><span>🎬</span><h3>AI Video</h3><p>वीडियो टूल</p></div>
<div class="card"><span>🌐</span><h3>AI Translator</h3><p>भाषा अनुवाद</p></div>
<div class="card"><span>📚</span><h3>AI Study</h3><p>पढ़ाई में मदद</p></div>
</div>
</main>
<footer>© 2026 Sanjay AI Tools | Made with ❤️</footer>
<script>
function filterTools(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
